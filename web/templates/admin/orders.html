<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управление заказами | PizzaHouse Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
    body { background-color: #0c0a09; color: #f5f5f4; min-height: 100vh; padding-bottom: 3rem; }
    header {
      background: #1c1917; border-bottom: 1px solid #292524;
      padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .header-left { display: flex; align-items: center; gap: 2rem; }
    .brand { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: #fff; font-weight: 800; font-size: 1.25rem; }
    .brand-icon { background: rgba(245, 158, 11, 0.2); border: 1px solid rgba(245, 158, 11, 0.4); padding: 0.35rem 0.5rem; border-radius: 10px; }
    nav { display: flex; align-items: center; gap: 0.5rem; }
    nav a {
      color: #a8a29e; text-decoration: none; font-size: 0.875rem; font-weight: 600;
      padding: 0.5rem 0.85rem; border-radius: 10px; transition: all 0.2s;
    }
    nav a:hover, nav a.active { color: #ffffff; background: #292524; }
    nav a.active { color: #f59e0b; }
    .header-right { display: flex; align-items: center; gap: 1rem; }
    .btn-site {
      background: #292524; color: #d6d3d1; text-decoration: none; padding: 0.45rem 0.85rem;
      border-radius: 10px; font-size: 0.8rem; font-weight: 700; border: 1px solid #44403c;
    }
    .btn-logout {
      background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 0.45rem 0.85rem; border-radius: 10px; font-size: 0.8rem; font-weight: 700; text-decoration: none;
    }
    main { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
    .page-header { margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .page-title { font-size: 1.75rem; font-weight: 800; color: #ffffff; }
    .filter-bar {
      display: flex; gap: 0.5rem; margin-bottom: 1.5rem; overflow-x: auto; padding-bottom: 0.5rem;
    }
    .filter-btn {
      background: #1c1917; border: 1px solid #292524; color: #a8a29e; padding: 0.5rem 1rem;
      border-radius: 12px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .filter-btn:hover, .filter-btn.active { color: #fff; background: #292524; border-color: #f59e0b; }
    .orders-list { display: flex; flex-direction: column; gap: 1.25rem; }
    .order-card {
      background: #1c1917; border: 1px solid #292524; border-radius: 20px;
      padding: 1.5rem; transition: border-color 0.2s;
    }
    .order-card:hover { border-color: #44403c; }
    .order-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid #292524; flex-wrap: wrap; gap: 0.75rem;
    }
    .order-id-group { display: flex; align-items: center; gap: 0.75rem; }
    .order-id { font-size: 1.15rem; font-weight: 800; color: #fff; }
    .order-source { font-size: 0.75rem; color: #a8a29e; background: #292524; padding: 0.25rem 0.5rem; border-radius: 6px; }
    .order-date { font-size: 0.8rem; color: #a8a29e; }
    .order-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
    @media (min-width: 768px) { .order-grid { grid-template-columns: 1.2fr 1fr; } }
    .info-block { font-size: 0.875rem; }
    .info-row { display: flex; margin-bottom: 0.4rem; gap: 0.5rem; }
    .info-label { color: #a8a29e; width: 100px; flex-shrink: 0; font-size: 0.8rem; }
    .info-value { color: #fff; font-weight: 600; }
    .items-table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; font-size: 0.85rem; }
    .items-table th { color: #a8a29e; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; padding: 0.4rem 0; border-bottom: 1px solid #292524; text-align: left; }
    .items-table td { padding: 0.5rem 0; border-bottom: 1px solid #292524; color: #e7e5e4; }
    .order-footer {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid #292524; flex-wrap: wrap; gap: 1rem;
    }
    .total-amount { font-size: 1.25rem; font-weight: 800; color: #f59e0b; }
    .status-select {
      background: #292524; border: 1px solid #44403c; color: #fff; font-size: 0.85rem;
      font-weight: 700; padding: 0.45rem 0.85rem; border-radius: 10px; outline: none; cursor: pointer;
    }
    .status-select:focus { border-color: #f59e0b; }
    .status-badge {
      display: inline-block; padding: 0.25rem 0.65rem; border-radius: 9999px;
      font-size: 0.75rem; font-weight: 700;
    }
    .status-expected { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .status-cooking { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .status-delivery { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
    .status-completed { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-cancelled { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <a href="/admin" class="brand">
        <span class="brand-icon">🍕</span>
        <span>PizzaHouse Admin</span>
      </a>
      <nav>
        <a href="/admin">Дашборд</a>
        <a href="/admin/products">Товары</a>
        <a href="/admin/orders" class="active">Заказы</a>
      </nav>
    </div>
    <div class="header-right">
      <a href="/" target="_blank" class="btn-site">Открыть сайт ↗</a>
      <a href="/admin/logout" class="btn-logout">Выйти</a>
    </div>
  </header>

  <main>
    <div class="page-header">
      <div>
        <h1 class="page-title">Управление заказами</h1>
        <p style="color: #a8a29e; font-size: 0.85rem; margin-top: 0.25rem;">
          Единая очередь заказов из Telegram-бота, Mini App и веб-сайта
        </p>
      </div>
      <button onclick="loadOrders()" class="filter-btn" style="background:#292524; color:#fff;">🔄 Обновить список</button>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" onclick="setStatusFilter('all', this)">Все заказы</button>
      <button class="filter-btn" onclick="setStatusFilter('expected', this)">🕒 Ожидаются</button>
      <button class="filter-btn" onclick="setStatusFilter('cooking', this)">🍳 Готовятся</button>
      <button class="filter-btn" onclick="setStatusFilter('delivery', this)">🚚 В доставке</button>
      <button class="filter-btn" onclick="setStatusFilter('completed', this)">✅ Выполнены</button>
      <button class="filter-btn" onclick="setStatusFilter('cancelled', this)">❌ Отменены</button>
    </div>

    <div id="ordersContainer" class="orders-list">
      <div style="text-align: center; color: #a8a29e; padding: 3rem;">Загрузка заказов...</div>
    </div>
  </main>

  <script>
    let currentStatus = 'all';

    function formatPrice(amount) {
      return (amount || 0).toLocaleString('ru-RU') + ' сум';
    }

    const statusMap = {
      'expected': { text: '🕒 Ожидается', class: 'status-expected' },
      'cooking': { text: '🍳 Готовится', class: 'status-cooking' },
      'delivery': { text: '🚚 В доставке', class: 'status-delivery' },
      'completed': { text: '✅ Выполнен', class: 'status-completed' },
      'cancelled': { text: '❌ Отменён', class: 'status-cancelled' }
    };

    function setStatusFilter(status, btn) {
      currentStatus = status;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadOrders();
    }

    async function loadOrders() {
      try {
        const url = `/admin/api/orders?status=${currentStatus}`;
        const res = await fetch(url);
        if (res.status === 401) {
          window.location.href = '/admin/login';
          return;
        }
        const orders = await res.json();
        renderOrders(orders);
      } catch (err) {
        console.error(err);
      }
    }

    function renderOrders(orders) {
      const container = document.getElementById('ordersContainer');
      if (!orders || orders.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: #a8a29e; padding: 3rem; background: #1c1917; border-radius: 20px;">Заказы не найдены</div>';
        return;
      }

      container.innerHTML = orders.map(order => {
        const st = statusMap[order.status] || { text: order.status, class: 'status-expected' };
        const items = order.items || [];

        return `
          <div class="order-card" id="order-${order.id}">
            <div class="order-header">
              <div class="order-id-group">
                <span class="order-id">Заказ №${order.id}</span>
                <span class="order-source">${order.source || '🤖 Бот'}</span>
                <span class="status-badge ${st.class}">${st.text}</span>
              </div>
              <div class="order-date">Создан: ${order.created_at || '—'}</div>
            </div>

            <div class="order-grid">
              <div class="info-block">
                <div class="info-row">
                  <span class="info-label">Получатель:</span>
                  <span class="info-value">${order.client_name || '—'}</span>
                </div>
                <div class="info-row">
                  <span class="info-label">Телефон:</span>
                  <span class="info-value">
                    <a href="tel:${order.phone}" style="color: #60a5fa; text-decoration: none;">${order.phone || '—'}</a>
                  </span>
                </div>
                <div class="info-row">
                  <span class="info-label">Адрес:</span>
                  <span class="info-value">${order.address || '—'}</span>
                </div>
                ${order.comment ? `
                  <div class="info-row">
                    <span class="info-label">Комментарий:</span>
                    <span class="info-value" style="color: #fbbf24;">${order.comment}</span>
                  </div>
                ` : ''}
                ${order.username ? `
                  <div class="info-row">
                    <span class="info-label">Telegram:</span>
                    <span class="info-value" style="color: #93c5fd;">@${order.username}</span>
                  </div>
                ` : ''}
              </div>

              <div>
                <table class="items-table">
                  <thead>
                    <tr>
                      <th>Позиция</th>
                      <th>Размер</th>
                      <th>Кол-во</th>
                      <th style="text-align: right;">Сумма</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${items.map(item => `
                      <tr>
                        <td style="font-weight: 700;">🍕 ${item.name}</td>
                        <td>${item.size ? item.size + ' см' : '—'}</td>
                        <td>× ${item.qty}</td>
                        <td style="text-align: right; color: #f59e0b; font-weight: 600;">${formatPrice(item.line_total)}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>

            <div class="order-footer">
              <div>
                <span style="color:#a8a29e; font-size:0.8rem; text-transform:uppercase; font-weight:700;">Итого к оплате:</span>
                <div class="total-amount">${formatPrice(order.total)}</div>
              </div>

              <div style="display:flex; align-items:center; gap:0.75rem;">
                <span style="font-size:0.8rem; color:#a8a29e; font-weight:600;">Сменить статус:</span>
                <select class="status-select" onchange="updateStatus(${order.id}, this.value)">
                  <option value="expected" ${order.status === 'expected' ? 'selected' : ''}>🕒 Ожидается</option>
                  <option value="cooking" ${order.status === 'cooking' ? 'selected' : ''}>🍳 Готовится</option>
                  <option value="delivery" ${order.status === 'delivery' ? 'selected' : ''}>🚚 В доставке</option>
                  <option value="completed" ${order.status === 'completed' ? 'selected' : ''}>✅ Выполнен</option>
                  <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>❌ Отменён</option>
                </select>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function updateStatus(orderId, newStatus) {
      try {
        const res = await fetch(`/admin/api/orders/${orderId}/status`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        });
        if (res.ok) {
          await loadOrders();
        } else {
          alert('Не удалось обновить статус');
        }
      } catch (err) {
        console.error(err);
        alert('Ошибка связи с сервером');
      }
    }

    loadOrders();
  </script>
</body>
</html>
