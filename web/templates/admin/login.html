<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход в панель управления | PizzaHouse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
    body {
      background-color: #0c0a09;
      color: #f5f5f4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .login-card {
      background: #1c1917;
      border: 1px solid #292524;
      border-radius: 24px;
      width: 100%;
      max-width: 400px;
      padding: 2.5rem 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .logo-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 20px;
      margin: 0 auto 1.5rem;
      font-size: 2rem;
    }
    h1 {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      text-align: center;
      color: #a8a29e;
      font-size: 0.875rem;
      margin-bottom: 2rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #d6d3d1;
      margin-bottom: 0.5rem;
    }
    input {
      width: 100%;
      background: #292524;
      border: 1px solid #44403c;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #f59e0b;
    }
    .btn-submit {
      width: 100%;
      background: #f59e0b;
      color: #0c0a09;
      border: none;
      border-radius: 14px;
      padding: 0.875rem;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 1rem;
    }
    .btn-submit:hover {
      background: #fbbf24;
      transform: translateY(-1px);
    }
    .btn-submit:active {
      transform: translateY(0);
    }
    .error-box {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-badge">🍕</div>
    <h1>PizzaHouse Admin</h1>
    <p class="subtitle">Панель управления заказами и меню</p>

    <div id="errorMessage" class="error-box"></div>

    <form method="POST" action="/admin/login" id="loginForm">
      <div class="form-group">
        <label for="username">Имя пользователя</label>
        <input type="text" id="username" name="username" required autocomplete="username" placeholder="admin">
      </div>
      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn-submit">Войти в панель</button>
    </form>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('error') === 'invalid') {
      const errBox = document.getElementById('errorMessage');
      errBox.innerText = 'Неверное имя пользователя или пароль';
      errBox.style.display = 'block';
    } else if (params.get('error') === 'required') {
      const errBox = document.getElementById('errorMessage');
      errBox.innerText = 'Пожалуйста, введите логин и пароль';
      errBox.style.display = 'block';
    }
  </script>
</body>
</html>
